# Example for the existing, audited zaithe.com HTTPS server block only.
# Back up the current vhost, retain its TLS configuration and old upstream.
# Do not include this at http{} level or replace another site's locations.
location / {
    proxy_pass http://127.0.0.1:3090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
}
